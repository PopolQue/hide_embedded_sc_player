<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SC-Player Shell</title>

  <!-- ═══════════════════════════════════════════════════════════════════
       SC-Player Shell — Drop-in persistent audio player
       ═══════════════════════════════════════════════════════════════════

       HOW TO USE:
       1. Edit the PLAYER_CONFIG object below with your data
       2. Change the initialContentUrl to your website's homepage
       3. Upload this file, sc-player-standalone.js, sc-player.css, playlists.js, and the assets/ folder
       4. Done — users see your site with a persistent player bar
  ═══════════════════════════════════════════════════════════════════ -->

  <!-- SoundCloud Widget API — required for the player -->
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <!-- Playlist Data -->
  <script src="playlists.js"></script>

  <!-- Player Styles -->
  <link rel="stylesheet" href="sc-player.css">

  <!-- ═══════════════════════════════════════════════════════════════════
       PLAYER CONFIG — Customize the player behavior and look
       ═══════════════════════════════════════════════════════════════════ -->
  <script>
    window.PLAYER_CONFIG = {
      /* ─── Theme: Customize colors and dimensions ─── */
      theme: {
        bg: '#111316',              // Player bar background
        border: '#333842',          // Border / divider color
        text: '#ffffffff',          // Primary text (title)
        muted: '#ffffffde',           // Secondary text (artist, duration)
        accent: '#1a1a1a',          // Play button, progress bar, active state
        accentHover: '#fffffdde',     // Play button hover color
        activeBg: '#1a1a24',        // Active track highlight
        listBg: '#111316',          // Track list panel background
        barHeight: '64px',          // Height of the player bar
        borderRadius: '4px',        // Artwork corner radius
        fontFamily: 'Inter, system-ui, sans-serif',
      },

      /* ─── Feature toggles ─── */
      showPlaylistSelect: true,     // Show playlist selector dropdown
      showTrackList: true,          // Show track list toggle button
      showProgress: true,           // Show progress/seek bar
      showNavButtons: true,         // Show prev / play / next buttons
      autoplayOnSelect: true,       // Auto-play when clicking a track
      autoplayDelay: 500,           // ms delay before auto-playing
      position: 'bottom',           // Player bar position: 'bottom' or 'top'

      /* ─── Data source ─── */
      defaultPlaylist: '2025',
      playlists: window.PLAYER_PLAYLISTS,
      scAccountUrl: 'https://soundcloud.com/kleinundhaarig',

      /* ─── SoundCloud embed URL ─── */
      scEmbedUrl: 'https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2158762997&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=true',
      
      /* ─── Shell Content Settings ─── */
      initialContentUrl: 'about:blank', // YOUR WEBSITE URL HERE
      syncUrl: true                      // Enable browser URL syncing
    }
  </script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #content {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transition: height 0.2s ease;
    }

    /* Dynamic spacing based on bar height and position */
    body.scp-pos-bottom { padding-bottom: var(--scp-bar-h, 64px); }
    body.scp-pos-top { padding-top: var(--scp-bar-h, 64px); }
    
    body.scp-pos-bottom #content { height: calc(100vh - var(--scp-bar-h, 64px)); }
    body.scp-pos-top #content { height: calc(100vh - var(--scp-bar-h, 64px)); }
  </style>
</head>

<body class="scp-pos-bottom">
  <!-- ═══ Content iframe — your actual website ═══ -->
  <iframe id="content" name="content" title="Main content" loading="lazy"></iframe>

  <!-- Player mounts here automatically -->
  <script src="sc-player-standalone.js"></script>

  <!-- Shell Logic: Theme Sync & URL Persistence -->
  <script>
    ;(function() {
      var cfg = window.PLAYER_CONFIG || {};
      var theme = cfg.theme || {};
      var iframe = document.getElementById('content');
      var barH = theme.barHeight || '64px';
      var pos = cfg.position || 'bottom';

      // 1. Apply theme-aware layout
      document.body.style.setProperty('--scp-bar-h', barH);
      document.body.className = 'scp-pos-' + pos;

      // 2. URL Syncing / Deep Linking
      if (cfg.syncUrl !== false) {
        var isInitialLoad = true;
        
        // Handle initial load: check if we have a sub-page in the hash
        var hash = window.location.hash.substring(1);
        var targetUrl = hash ? decodeURIComponent(hash) : cfg.initialContentUrl;
        
        iframe.src = targetUrl;

        // Update browser URL when iframe navigates
        iframe.addEventListener('load', function() {
          if (isInitialLoad) {
            isInitialLoad = false;
            return;
          }
          try {
            var currentPath = iframe.contentWindow.location.href;
            // Only sync if it's the same origin to avoid security errors
            if (currentPath.indexOf(window.location.origin) === 0) {
              var relativePath = currentPath.replace(window.location.origin, '');
              window.history.replaceState(null, '', '#' + encodeURIComponent(relativePath));
            }
          } catch (e) {
            // Cross-origin iframe navigation - we can't read the URL for security
            console.warn('SC-Player: Cannot sync URL for cross-origin navigation.');
          }
        });

        // Handle browser back/forward: update iframe if hash changes
        window.addEventListener('hashchange', function() {
          var newHash = window.location.hash.substring(1);
          if (newHash) {
            var newUrl = decodeURIComponent(newHash);
            if (iframe.contentWindow.location.href !== newUrl) {
              iframe.src = newUrl;
            }
          }
        });
      } else {
        iframe.src = cfg.initialContentUrl;
      }
    })();
  </script>
</body>

</html>
